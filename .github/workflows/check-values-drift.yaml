# Hand-maintained (NOT generated by devctl). Fails a PR when the upstream chart
# introduces value keys that helm/kueue/values.yaml (hand-maintained, never
# touched by vendir) has not been reconciled against. See hack/check-values-drift.sh.
name: Check values.yaml drift

on:
  pull_request:
    paths:
      - helm/kueue/values.yaml
      - upstream/charts/kueue/values.yaml
      - hack/check-values-drift.sh
      - .github/workflows/check-values-drift.yaml

permissions:
  contents: read

jobs:
  check-values-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Check values.yaml is in sync with upstream
        run: ./hack/check-values-drift.sh
