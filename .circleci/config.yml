version: 2.1
orbs:
  architect: giantswarm/architect@10.11.1

workflows:
  package-and-push-chart-on-tag:
    jobs:
    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: package-and-push-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: 'kueue'
        # Keep the appVersion declared in Chart.yaml. The chart derives the
        # controller image tag from appVersion
        # (templates/manager/manager.yaml: `image.tag | default .Chart.AppVersion`),
        # so letting app-build-suite stamp it with the build version makes branch
        # builds reference gsoci.azurecr.io/giantswarm/kueue:<build-version>, a tag
        # that only ever exists for real upstream Kueue releases. abs 2.4.1's
        # HelmImageReferenceValidator fails the build on it.
        override_app_version: false
          # Trigger job on git tag.
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master
